name: Build and Publish Portable Release

on:
  push:
    tags:
      - 'v*' # Triggers on v1.0.0, v1.0.1, etc.

jobs:
  release:
    name: Build & Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Assets
        run: |
          npm run install-all
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        run: |
          cd backend
          composer install --no-dev --optimize-autoloader --ignore-platform-reqs

      - name: Generate Application Key
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate --force

      - name: Package Release ZIP
        run: |
          zip -r trustcare-workshop-system.zip backend bin run.bat -x "backend/node_modules/*" "backend/tests/*" "backend/storage/logs/*" "backend/.phpunit.result.cache" "**/node_modules/*" "frontend/*" ".git/*" ".github/*" "build-production.js"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: trustcare-workshop-system.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
